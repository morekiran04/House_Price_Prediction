<!DOCTYPE html>
<html>

<head>
    <title>House Price Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🏠 House Price Prediction</h1>

    <form action="/predict" method="post">

        <input type="number"
               name="bedrooms"
               placeholder="Number of Bedrooms"
               required>

        <input type="number"
               name="bathrooms"
               placeholder="Number of Bathrooms"
               required>

        <input type="number"
               name="living_area"
               placeholder="Living Area"
               required>

        <input type="number"
               name="floors"
               placeholder="Number of Floors"
               required>

        <button type="submit">
            Predict Price
        </button>

    </form>

    {% if prediction %}
        <h2>
            Predicted Price: ₹ {{ prediction }}
        </h2>
    {% endif %}

</div>

</body>
</html>
